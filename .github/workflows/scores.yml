name: Matchup scores

on:
  workflow_dispatch:
  schedule:
    # Thursday midnight CT through Sunday noon CT. Rankings are not rebuilt.
    - cron: "0 5-23 * * 4"
    - cron: "0 * * * 5,6"
    - cron: "0 0-17 * * 0"

permissions:
  contents: write

jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Write finals onto the current card
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: PYTHONPATH=src python3 -m cfmp.cli.scores

      - name: Commit the card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/latest/Week*Matchups.csv data/reports/*/Week*Matchups.csv
          if git diff --cached --quiet; then
            echo "No new finals."
            exit 0
          fi
          git commit -m "Add final scores to the weekly card"
          git push

name: daily-pipeline

on:
  schedule:
    # Thu, Fri, Sat at 12:00 UTC ≈ 6:00 CST / 7:00 CDT
    - cron: "0 12 * * 4,5,6"
    # Sunday verifier at 15:00 UTC ≈ 9:00 CST / 10:00 CDT
    - cron: "0 15 * * 0"
  workflow_dispatch:


jobs:
  run-season:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Season gate
        run: |
          month=$(TZ=America/Chicago date +%m)
          if [ "$month" -lt 8 ] && [ "$month" -ne 1 ]; then
            echo "Off-season → skip."
            exit 0
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Run slate
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
          TZ: America/Chicago
          CFB_WEEK: ""
        run: python -m cfmp.cli.run_week

      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: runs/**

name: daily-pipeline

on:
  schedule:
    # Thu, Fri, Sat 10:00 UTC  ≈ 6:00 CST / 7:00 CDT
    - cron: "0 10 * * 4,5,6"
    # Sunday verifier at 15:00 UTC ≈ 9:00 CST / 10:00 CDT
    - cron: "0 15 * * 0"
  workflow_dispatch:

jobs:
  run-season:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e .
          # parquet writer/reader for venues cache
          pip install pyarrow pandas

      - name: Run slate
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
          TZ: America/Chicago
          # lock explicit year/week so CI never drifts to ISO week 44
          CFB_YEAR: '2025'
          CFB_WEEK: '10'
          # set to "on" to pull NWS; leave off to keep CI fast/stable
          CFMP_WEATHER: 'off'
        run: |
          set -euxo pipefail
          echo "==> running cfmp.cli.run_week"
          python -m cfmp.cli.run_week

      - name: Locate latest run folder
        id: locate
        run: |
          set -e
          RUN_DIR=$(ls -td runs/* | head -1 || true)
          echo "RUN_DIR=${RUN_DIR}" >> "$GITHUB_ENV"
          echo "RUN_NAME=${RUN_DIR##runs/}" >> "$GITHUB_ENV"
          echo "Found ${RUN_DIR}"

      - name: Upload run artifact
        if: env.RUN_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: cfmp-${{ env.RUN_NAME }}
          path: ${{ env.RUN_DIR }}
          if-no-files-found: error
          retention-days: 14

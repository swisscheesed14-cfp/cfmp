name: FPI reports

on:
  workflow_dispatch:
  schedule:
    # Sunday 1:00pm CT locks the DraftKings open and prices the slate.
    # Monday 9:00am CT publishes rankings once the snaps are in, and locks
    # the open only if Sunday never ran. Tuesday through Saturday refresh
    # the current DraftKings number and leave the open alone.
    - cron: "0 18 * * 0"
    - cron: "0 15 * * 1"
    - cron: "0 16 * * 2-6"

permissions:
  contents: write

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: snaps
        with:
          path: |
            data/cfbd/game_model.parquet
            data/schedules
          key: fpi-snaps-v1-${{ github.run_id }}
          restore-keys: |
            fpi-snaps-v1-

      - name: Install
        run: pip install -e .

      - name: Publish reports and price the next slate
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
        run: PYTHONPATH=src python3 -m cfmp.cli.fpi_report

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports
          if git diff --cached --quiet; then
            echo "No new week to publish."
            exit 0
          fi
          git commit -m "Publish FPI reports"
          git push

      - name: Check mail secret
        id: mail
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "$MAIL_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "MAIL_PASSWORD is not set. Email skipped."
          fi

      - name: Email the reports
        if: steps.mail.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: swisscheesed14@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          from: FPI reports <swisscheesed14@gmail.com>
          to: swisscheesed14@gmail.com
          subject: FPI reports
          body: |
            Four files are attached.
            fpi_top25.csv is the top 25.
            fpi.csv is every team.
            sos.csv is every team's schedule strength.
            prices.csv is the weekly card. A positive number favors the home team.
          attachments: data/reports/latest/fpi_top25.csv,data/reports/latest/fpi.csv,data/reports/latest/sos.csv,data/reports/latest/prices.csv


[project]
name = "cfmp"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pandas","duckdb","httpx","pydantic>=2","numpy","scipy","scikit-learn",
  "orjson","pyarrow","tenacity","python-dotenv","pyyaml"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
